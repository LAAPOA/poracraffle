<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d81b3a"/>
      <stop offset="1" stop-color="#a50d26"/>
    </linearGradient>
    <linearGradient id="tk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc4f2"/>
      <stop offset="1" stop-color="#3a9fd8"/>
    </linearGradient>
    <mask id="notch">
      <rect x="-300" y="-300" width="600" height="600" fill="#fff"/>
      <circle cx="-210" cy="0" r="30" fill="#000"/>
      <circle cx="210" cy="0" r="30" fill="#000"/>
      <circle cx="70" cy="-125" r="13" fill="#000"/>
      <circle cx="70" cy="125" r="13" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(262 268) rotate(-22)">
    <!-- shadow -->
    <rect x="-204" y="-117" width="420" height="250" rx="16" fill="#000" opacity=".25" mask="url(#notch)" transform="translate(10 14)"/>
    <!-- ticket -->
    <rect x="-210" y="-125" width="420" height="250" rx="16" fill="url(#tk)" mask="url(#notch)"/>
    <!-- perforation -->
    <line x1="70" y1="-108" x2="70" y2="108" stroke="#1d3d55" stroke-width="7" stroke-dasharray="4 13" stroke-linecap="round" opacity=".7"/>
    <!-- inner frame on main part -->
    <rect x="-176" y="-92" width="220" height="184" rx="8" fill="none" stroke="#1d3d55" stroke-width="5" opacity=".55"/>
    <!-- number bars (abstract digits) -->
    <g fill="#13283a">
      <text x="-66" y="14" text-anchor="middle" font-family="Arial Black, 'DejaVu Sans', Arial, sans-serif" font-weight="900" font-size="62" letter-spacing="1">2026</text>
      <rect x="-140" y="40" width="148" height="14" rx="5" opacity=".55"/>
    </g>
    <!-- stub star -->
    <path d="M140 -38 L152 -8 L184 -6 L159 14 L168 46 L140 28 L112 46 L121 14 L96 -6 L128 -8 Z" fill="#fff" opacity=".95"/>
    <!-- light edge -->
    <line x1="-190" y1="-114" x2="40" y2="-114" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".5"/>
  </g>
</svg>
